name: Zero-Trust LAN Advisor
version: "0.3.0"
slug: zerotrust_advisor
description: Passive firewall/flow log analysis with LLM-assisted zero-trust rule recommendations
url: https://github.com/vohkts/ha-zerotrust-lan-advisor
arch:
  - amd64
  - aarch64
init: false
apparmor: false
# hassio_api + hassio_role: manager are needed for GET /network/info (used
# to show the router-facing host IP on Setup, and to recognize "traffic to
# this add-on's own receiver" for the noise filter) — self-management calls
# like saving this add-on's own options work without either, which is why
# that path was never broken; only the network lookup was ever affected.
# manager, not admin: the narrowest role that covers host/network reads.
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock-outline
map:
  - data:rw
ports:
  514/udp: 514
  2055/udp: 2055
options:
  syslog_port: 514
  netflow_port: 2055
  allowed_sources: []
  network_labels: []
  retention_days: 90
  min_recurring_days: 3
  ignore_own_receiver_traffic: true
  enable_mdns_classification: false
  llm_mode: local
  llm_remote_base_url: ""
  llm_model_path: ""
  llm_send_real_identifiers: false
  unifi_enabled: false
  unifi_host: ""
  unifi_verify_tls: false
  unifi_apply_mode: manual
  display_timezone_utc: false
  ignore_unifi_console_traffic: true
schema:
  syslog_port: port
  netflow_port: port
  allowed_sources:
    - match(^([0-9]{1,3}\.){3}[0-9]{1,3}$)
  network_labels:
    - match(^.+=.+$)
  retention_days: int(7,365)
  min_recurring_days: int(1,30)
  ignore_own_receiver_traffic: bool
  enable_mdns_classification: bool
  llm_mode: list(local|remote)
  llm_remote_base_url: str
  llm_model_path: str
  llm_send_real_identifiers: bool
  unifi_enabled: bool
  unifi_host: str
  unifi_verify_tls: bool
  unifi_apply_mode: list(manual|automatic)
  display_timezone_utc: bool
  ignore_unifi_console_traffic: bool
