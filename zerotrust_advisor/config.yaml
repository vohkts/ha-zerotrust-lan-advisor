name: Zero-Trust LAN Advisor
version: "0.1.0"
slug: zerotrust_advisor
description: Passive firewall/flow log analysis with LLM-assisted zero-trust rule recommendations
url: https://github.com/vohkts/ha-zerotrust-lan-advisor
arch:
  - amd64
  - aarch64
init: false
apparmor: false
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock-outline
map:
  - data:rw
ports:
  514/udp: 514
  2055/udp: 2055
options:
  syslog_port: 514
  netflow_port: 2055
  allowed_sources: []
  network_labels: []
  retention_days: 90
  min_recurring_days: 3
  enable_mdns_classification: false
  llm_mode: local
  llm_remote_base_url: ""
  llm_model_path: ""
schema:
  syslog_port: port
  netflow_port: port
  allowed_sources:
    - match(^([0-9]{1,3}\.){3}[0-9]{1,3}$)
  network_labels:
    - match(^.+=.+$)
  retention_days: int(7,365)
  min_recurring_days: int(1,30)
  enable_mdns_classification: bool
  llm_mode: list(local|remote)
  llm_remote_base_url: str
  llm_model_path: str
