<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero-Trust LAN Advisor</title>
  <!-- Relative, no leading slash: Ingress serves this app under a
       per-install path prefix the app is never told, so an absolute
       "/static/..." link would point the browser at the wrong host path.
       Every link/form action in this app follows the same rule. -->
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">ZT</span>
        <span class="brand-name">Zero-Trust<br>LAN Advisor</span>
      </div>
      <nav>
        <a href="traffic" data-nav="traffic">Traffic</a>
        <a href="recommendations" data-nav="recommendations">Recommendations</a>
        {% if show_network_nav %}<a href="network" data-nav="network">Network</a>{% endif %}
        <a href="setup" data-nav="setup">Setup</a>
      </nav>
    </aside>
    <div class="main">
      {% block content %}{% endblock %}
    </div>
  </div>
  <script src="static/app.js"></script>
</body>
</html>
