<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero-Trust LAN Advisor</title>
  <!-- Relative, no leading slash: Ingress serves this app under a
       per-install path prefix the app is never told, so an absolute
       "/static/..." link would point the browser at the wrong host path.
       Every link/form action in this app follows the same rule. -->
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header>
    <h1>Zero-Trust LAN Advisor</h1>
    <nav>
      <a href="setup">Setup</a>
      <a href="recommendations">Recommendations</a>
      <a href="settings">Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="static/app.js"></script>
</body>
</html>
